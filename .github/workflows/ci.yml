name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-${{ matrix.os }}
          path: '**/target/surefire-reports/**'

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Package
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          mvn dependency:tree -pl core,vertx -am > dependency-tree.txt
          ! grep -E 'com\.openai|okhttp|kotlin-stdlib|software\.amazon\.awssdk' dependency-tree.txt
      - name: Core module boundaries
        shell: bash
        run: |
          set -euo pipefail
          jdeps --multi-release 25 --ignore-missing-deps core/target/pi-agent-core-0.1.0-SNAPSHOT.jar > core-jdeps.txt
          ! grep -E 'io\.vertx|io\.smallrye\.mutiny|io\.netty|software\.amazon' core-jdeps.txt
      - name: Fixture hashes
        shell: bash
        run: sha256sum compat-fixtures/*.json | sort
      - name: Public API baseline
        shell: bash
        run: |
          set -euo pipefail
          tools/generate-public-api-baseline.sh target/public-api-current.txt
          diff -u compat-fixtures/public-api-0.1.0.txt target/public-api-current.txt
      - name: Compile headless host examples
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -q -pl vertx -am dependency:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/target/example-classpath.txt"
          javac --release 25 -cp "ai/target/classes:core/target/classes:vertx/target/classes:$(cat target/example-classpath.txt)" -d target/example-classes examples/HeadlessExtensionHost.java examples/HeadlessAgentRuntime.java
      - name: Verify disabled live-test profile wiring
        shell: bash
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GOOGLE_API_KEY: ''
          GOOGLE_VERTEX_ACCESS_TOKEN: ''
          MISTRAL_API_KEY: ''
          AWS_BEARER_TOKEN_BEDROCK: ''
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          PI_LIVE_OPENAI_COMPAT_BASE_URL: ''
          PI_LIVE_OPENAI_COMPAT_MODEL: ''
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -q -Pprovider-live-tests -pl vertx -am failsafe:integration-test failsafe:verify
          grep -E 'Tests run: 7, Failures: 0, Errors: 0, Skipped: 7' vertx/target/failsafe-reports/io.github.idoly.pi.vertx.ProviderLiveIT.txt
      - name: Attached artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f ai/target/pi-agent-ai-0.1.0-SNAPSHOT-sources.jar
          test -f ai/target/pi-agent-ai-0.1.0-SNAPSHOT-javadoc.jar
          test -f core/target/pi-agent-core-0.1.0-SNAPSHOT-sources.jar
          test -f core/target/pi-agent-core-0.1.0-SNAPSHOT-javadoc.jar
          test -f vertx/target/pi-agent-vertx-0.1.0-SNAPSHOT-sources.jar
          test -f vertx/target/pi-agent-vertx-0.1.0-SNAPSHOT-javadoc.jar

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: '**/target/surefire-reports/**'

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Package
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          mvn dependency:tree -pl core,vertx -am > dependency-tree.txt
          ! grep -E 'com\.openai|okhttp|kotlin-stdlib' dependency-tree.txt
      - name: Core module boundaries
        shell: bash
        run: |
          set -euo pipefail
          jdeps --multi-release 25 --ignore-missing-deps core/target/pi-agent-core-0.1.0-SNAPSHOT.jar > core-jdeps.txt
          ! grep -E 'io\.vertx|io\.smallrye\.mutiny|io\.netty' core-jdeps.txt
      - name: Fixture hashes
        shell: bash
        run: sha256sum compat-fixtures/*.json | sort
      - name: Attached artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f ai/target/pi-agent-ai-0.1.0-SNAPSHOT-sources.jar
          test -f ai/target/pi-agent-ai-0.1.0-SNAPSHOT-javadoc.jar
          test -f core/target/pi-agent-core-0.1.0-SNAPSHOT-sources.jar
          test -f core/target/pi-agent-core-0.1.0-SNAPSHOT-javadoc.jar
          test -f vertx/target/pi-agent-vertx-0.1.0-SNAPSHOT-sources.jar
          test -f vertx/target/pi-agent-vertx-0.1.0-SNAPSHOT-javadoc.jar
